<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Informasi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .gambar {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
    }

    .gambar img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

  <div class="gambar">
    <img src="gambar.jpg" alt="Gambar">
  </div>

</body>
</html>
